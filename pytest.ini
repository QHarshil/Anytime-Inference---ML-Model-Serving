[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --strict-markers
    --strict-config
    -ra
markers =
    slow: takes more than a few seconds; deselect with -m "not slow"
    needs_torch: requires torch/torchvision/transformers
    needs_runtime: requires the compiled anytime_runtime extension
filterwarnings =
    error::DeprecationWarning:anytime_serving.*
    default
