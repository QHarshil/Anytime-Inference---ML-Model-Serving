name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Installing the package compiles the extension, which needs an ONNX
      # Runtime SDK matching the wheel. CMake downloads it here and reuses it on
      # later runs.
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      - name: Install
        run: pip install -e ".[bench]" pytest
      # The extension is the runtime, so an install that silently fell back to
      # the Python backend would hide a broken build behind passing tests.
      - name: Assert the extension was built
        run: |
          python -c "
          from anytime_serving.serving import extension_available, load_extension
          import onnxruntime
          assert extension_available(), 'anytime_runtime did not build or import'
          print('anytime_runtime links ONNX Runtime', load_extension().onnxruntime_version())
          print('onnxruntime wheel reports         ', onnxruntime.__version__)
          "
      - name: Run tests
        env:
          ANYTIME_REQUIRE_BACKENDS: extension,python
        run: pytest -q

  test-minimal:
    name: Tests without torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      # The serving control plane must run without the research stack. Installing
      # only the base dependencies enforces that: a module-scope torch or pandas
      # import anywhere on the serving path fails this job.
      - name: Install base dependencies only
        run: pip install -e . pytest
      - name: Assert torch and pandas are absent
        run: |
          for dep in torch pandas; do
            if python -c "import $dep" 2>/dev/null; then
              echo "$dep must not be installed in this job"; exit 1
            fi
          done
      - name: Import the serving plane
        run: python -c "import anytime_serving.serving, anytime_serving.models.cascade"
      # The remaining suites need pandas/scipy and are covered by the `test` job.
      # The decoder suites belong here too: the KV cache and its admission policy are
      # part of the control plane, so they have to run where the research stack does
      # not. They build a synthetic decoder graph rather than exporting one, and the
      # GPT-2 cases skip when that export is absent, which it always is here.
      - name: Run serving tests and import-boundary guards
        env:
          ANYTIME_REQUIRE_BACKENDS: extension,python
        run: |
          pytest -q \
            tests/test_admission.py \
            tests/test_selector.py \
            tests/test_serving.py \
            tests/test_load_monitor.py \
            tests/test_runtime_engine.py \
            tests/test_kv_cache.py \
            tests/test_decoder_session.py \
            tests/test_decoder_client.py \
            tests/test_kv_admission.py \
            tests/test_batch_scheduler.py \
            tests/test_profile_decode.py \
            tests/test_profile_batching.py \
            tests/test_decode_sweep.py \
            tests/test_import_boundaries.py

  engine:
    name: Engine parity against the reference backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      - name: Install
        run: pip install -e . pytest
      # Both copies of ONNX Runtime in this process must be the same version. The
      # extension reports what it linked; the wheel reports what it will import.
      - name: Report the resolved ONNX Runtime versions
        run: |
          python -c "
          from anytime_serving.serving import load_extension
          import onnxruntime
          linked = load_extension().onnxruntime_version()
          print('anytime_runtime links ONNX Runtime', linked)
          print('onnxruntime wheel reports         ', onnxruntime.__version__)
          assert linked == onnxruntime.__version__
          "
      # Two comparisons, same discipline. The engine is checked against ONNX Runtime's
      # own Python API on an encoder graph; the block-allocated KV cache is checked
      # against holding that cache contiguously, which is the faster path it replaces.
      - name: Compare the extension against the reference backend
        env:
          ANYTIME_REQUIRE_BACKENDS: extension,python
        run: pytest -q tests/test_runtime_engine.py
      - name: Compare the block-allocated cache against contiguous KV
        env:
          ANYTIME_REQUIRE_BACKENDS: extension,python
        run: pytest -q tests/test_kv_cache.py tests/test_decoder_session.py
