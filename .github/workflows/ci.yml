name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Installing the package compiles the extension, which needs an ONNX
      # Runtime SDK matching the wheel. CMake downloads it here and reuses it on
      # later runs.
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      - name: Install
        run: pip install -e ".[bench]" pytest
      # The extension is the runtime, so an install that silently fell back to
      # the Python backend would hide a broken build behind passing tests.
      - name: Assert the extension was built
        run: |
          python -c "
          from anytime_serving.serving import extension_available, load_extension
          import onnxruntime
          assert extension_available(), 'anytime_runtime did not build or import'
          print('anytime_runtime links ONNX Runtime', load_extension().onnxruntime_version())
          print('onnxruntime wheel reports         ', onnxruntime.__version__)
          "
      - name: Run tests
        env:
          ANYTIME_REQUIRE_BACKENDS: extension,python
        run: pytest -q

  test-minimal:
    name: Tests without torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      # The serving control plane must run without the research stack. Installing
      # only the base dependencies enforces that: a module-scope torch or pandas
      # import anywhere on the serving path fails this job.
      - name: Install base dependencies only
        run: pip install -e . pytest
      - name: Assert torch and pandas are absent
        run: |
          for dep in torch pandas; do
            if python -c "import $dep" 2>/dev/null; then
              echo "$dep must not be installed in this job"; exit 1
            fi
          done
      - name: Import the serving plane
        run: python -c "import anytime_serving.serving, anytime_serving.models.cascade"
      # The remaining suites need pandas/scipy and are covered by the `test` job.
      - name: Run serving tests and import-boundary guards
        env:
          ANYTIME_REQUIRE_BACKENDS: extension,python
        run: |
          pytest -q \
            tests/test_admission.py \
            tests/test_selector.py \
            tests/test_serving.py \
            tests/test_load_monitor.py \
            tests/test_runtime_engine.py \
            tests/test_import_boundaries.py

  engine:
    name: Engine parity across all three backends
    runs-on: ubuntu-latest
    # The whole point of this job is comparing the extension against the
    # subprocess worker it replaces, which means building both and refusing to
    # skip either.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the ONNX Runtime SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/anytime-inference-planner
          key: ort-sdk-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ort-sdk-${{ runner.os }}-
      - name: Install
        run: pip install -e . pytest
      # The subprocess worker links its own SDK. Reuse the one CMake resolved for
      # the extension, so both halves of the comparison are the same build of
      # ONNX Runtime and a disagreement cannot be blamed on versions.
      - name: Locate the resolved SDK
        run: |
          root=$(find ~/.cache/anytime-inference-planner -maxdepth 3 -type d \
            -name include -exec dirname {} \; | head -1)
          if [ -z "$root" ]; then
            echo "no ONNX Runtime SDK found in the cache"; exit 1
          fi
          echo "ONNXRUNTIME_ROOT_PATH=$root" >> "$GITHUB_ENV"
          echo "resolved $root ($(cat "$root/VERSION_NUMBER"))"
      - name: Build the subprocess worker
        run: |
          cmake -S runtime_cpp -B runtime_cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DONNXRUNTIME_ROOT_PATH="$ONNXRUNTIME_ROOT_PATH"
          cmake --build runtime_cpp/build -j"$(nproc)"
      - name: Verify the worker starts and reports its usage
        run: |
          # No --model argument is an error; the binary must exit non-zero with a
          # message rather than hang waiting on stdin.
          if runtime_cpp/build/anytime_runtime </dev/null; then
            echo "expected a non-zero exit without --model"; exit 1
          fi
      - name: Compare all three backends
        env:
          ANYTIME_REQUIRE_BACKENDS: extension,python,subprocess
        run: pytest -q tests/test_runtime_engine.py
